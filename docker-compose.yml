version: '3.8'

services:
  db:
    build:
      context: .
      dockerfile: docker/Dockerfile_db
    image: postgres:17
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  migration:
    build:
      context: .
      dockerfile: docker/Dockerfile_migration
    depends_on:
      - db
    env_file:
      - dev.env
    entrypoint: ["./wait-for-it.sh", "db:5432", "--"] 
    command: ["./main"]

  auth_service:
    build:
      context: .
      dockerfile: docker/Dockerfile_service
    depends_on:
      - db
    env_file:
      - dev.env
    ports:
      - "8080:8080"
      - "50051:50051"
    entrypoint: ["./wait-for-it.sh", "db:5432", "--"] 
    command: ["./main"]
volumes:
  pgdata: